<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Athar Al Ilm  Punctured Seal mark">
  <!-- Solid seal with rounded negative-space cuts: heritage / athar stamp -->
  <defs>
    <mask id="seal-cuts">
      <rect width="100" height="100" fill="white"/>
      <!-- Rounded perforations (asymmetric grid) -->
      <circle cx="42" cy="40" r="5.5" fill="black"/>
      <circle cx="58" cy="40" r="5.5" fill="black"/>
      <circle cx="42" cy="56" r="5.5" fill="black"/>
      <circle cx="58" cy="56" r="5.5" fill="black"/>
      <circle cx="50" cy="72" r="4" fill="black"/>
      <circle cx="50" cy="28" r="3.5" fill="black"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="34" fill="#0B3D2E" mask="url(#seal-cuts)"/>
</svg>
